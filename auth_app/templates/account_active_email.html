<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Account Activation</title>
</head>
<body>

       <p style="text-align:center; margin:0 0 24px 0;">
        <img src="cid:logo" alt="Videoflix Logo" width="200" style="display:block; margin:auto;">
    </p>
        <p style="margin:0 0 16px 0;">
                Dear <strong>{{ user}}</strong>,
        </p>


                <p style="margin:0 0 24px 0;">
                Thanks for registering with <strong>Videoflix</strong>.<br>
                To complete your registration and verify your email address,
                please click the link below:
              </p>
    
    <button>
        <a href="http://{{ domain }}api/activate/{{ uid }}/{{ token }}/">
            Activate Account
        </a>
    </button>

    <p>If the link does not work, please copy and paste it into your browser:</p>
    <p>http://{{ domain }}api/activate/{{ uid }}/{{ token }}</p>

    <br>
    <p>Thank you,<br>Your Team</p>
</body>
</html>
